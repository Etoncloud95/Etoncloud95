name: Build APK

on:
  push:
    paths:
      - "web/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build
        run: gradle -p android assembleRelease
      - name: Check that the APK has no internet permission
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump permissions android/app/build/outputs/apk/release/app-release.apk | tee perms.txt
          ! grep -q "android.permission.INTERNET" perms.txt
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk BLOCK-ALT-UNO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BLOCK-ALT-UNO-apk
          path: BLOCK-ALT-UNO.apk

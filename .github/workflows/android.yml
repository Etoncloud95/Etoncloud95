name: Build APK

on:
  push:
    paths:
      - "web/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build
        run: gradle -p android assembleRelease
      - name: Check that the APK has no internet permission
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump permissions android/app/build/outputs/apk/release/app-release.apk | tee perms.txt
          ! grep -q "android.permission.INTERNET" perms.txt
      - name: Rename
        run: |
          V=$(grep -o 'bau-version" content="[0-9]*' web/index.html | grep -o '[0-9]*$')
          echo "GAME_VERSION=$V" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk BLOCK-SUPER-GF.apk
          cp android/app/build/outputs/apk/release/app-release.apk "BLOCK-SUPER-GF-v$V.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: BLOCK-SUPER-GF-apk
          path: BLOCK-SUPER-GF.apk
      # Every version keeps its own permanent release (apk-v10, apk-v11, ...).
      - name: Publish this version's APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ env.GAME_VERSION }}
          target_commitish: ${{ github.sha }}
          name: BLOCK SUPER GF v${{ env.GAME_VERSION }}
          body: "APK da versão ${{ env.GAME_VERSION }}. Baixe BLOCK-SUPER-GF-v${{ env.GAME_VERSION }}.apk abaixo."
          files: BLOCK-SUPER-GF-v${{ env.GAME_VERSION }}.apk
          make_latest: false
      # The fixed link always points to the newest build.
      - name: Publish APK as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: BLOCK SUPER GF (APK)
          body: "Baixe BLOCK-SUPER-GF.apk abaixo e abra no celular para instalar."
          files: BLOCK-SUPER-GF.apk
          make_latest: true

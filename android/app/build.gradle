plugins {
    id "com.android.application"
}

// Single source of truth for the version: <meta name="bau-version"> in web/index.html.
// Bump it by one on every change; the app name becomes "BLOCK ALT UNO v<N>".
def gameVersion = ((file("../../web/index.html").text =~ /name="bau-version" content="(\d+)"/)[0][1]) as Integer

android {
    namespace "com.blockaltuno.game"
    compileSdk 35

    defaultConfig {
        applicationId "com.blockaltuno.game"
        minSdk 26
        targetSdk 35
        versionCode gameVersion
        versionName "v" + gameVersion
        resValue "string", "app_name", "BLOCK ALT UNO v" + gameVersion
    }

    // The game itself lives in /web/index.html and is shipped as an asset.
    sourceSets {
        main {
            assets.srcDirs = ["../../web"]
        }
    }

    // A fixed key kept in the repo so every new APK installs over the previous one.
    // It is fine for installing on your own phones; use a private key to publish in a store.
    signingConfigs {
        sideload {
            storeFile file("blockaltuno.keystore")
            storePassword "blockaltuno"
            keyAlias "blockaltuno"
            keyPassword "blockaltuno"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

plugins {
    id "com.android.application"
}

android {
    namespace "com.blockaltuno.game"
    compileSdk 35

    defaultConfig {
        applicationId "com.blockaltuno.game"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // The game itself lives in /web/index.html and is shipped as an asset.
    sourceSets {
        main {
            assets.srcDirs = ["../../web"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly; use your own key to publish.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

<title>BLOCK ALT UNO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen column (header, wooden board, tray of 3 pieces), dark walnut room, maple board. Single deliberate theme. */
:root {
  --bg: #241912;
  --panel: #33241a;
  --ink: #f4e7d4;
  --muted: #bda78c;
  --amber: #eaa53c;
  --maple: #d6ae7b;
  --maple-2: #c99f6b;
  --groove: #a97f4f;
  --danger: #e0674b;
  --w1: #a8452c; --w2: #6b4226; --w3: #c27f3c; --w4: #8a5a2b; --w5: #7c7a3c; --w6: #4f6873;
  --font-display: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --cell: 40px;
  --gap: 3px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  background-image: repeating-linear-gradient(92deg, rgba(255,255,255,.018) 0 2px, transparent 2px 9px),
                    radial-gradient(120% 80% at 50% 0%, var(--panel), var(--bg));
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#app {
  height: 100%;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  display: flex; flex-direction: column; align-items: center;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, .slot:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; border-radius: 10px; }

/* ---------- Menu ---------- */
#menu { flex: 1; width: 100%; max-width: 420px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
.logo { display: grid; gap: 10px; justify-items: center; }
.logo-blocks { display: grid; grid-template-columns: repeat(4, 22px); gap: 4px; }
.logo-blocks i { width: 22px; height: 22px; border-radius: 4px; }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800; font-stretch: condensed;
  font-size: clamp(40px, 13vw, 58px); line-height: .9; letter-spacing: .02em; text-align: center; text-wrap: balance;
  color: var(--ink); text-shadow: 0 3px 0 var(--w2), 0 6px 18px rgba(0,0,0,.45);
}
h1 span { color: var(--amber); }
.tag { margin: 0; text-align: center; color: var(--muted); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; }
.modes { display: grid; gap: 12px; }
.mode {
  display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px;
  text-align: left; padding: 14px 16px; border-radius: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)), var(--panel);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 6px 0 rgba(0,0,0,.35);
  transition: transform .12s;
}
.mode:active { transform: translateY(3px); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 3px 0 rgba(0,0,0,.35); }
.mode b { display: block; font-family: var(--font-display); font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.mode small { color: var(--muted); font-size: 13px; }
.mode .rec { text-align: right; font-variant-numeric: tabular-nums; }
.mode .rec em { display: block; font-style: normal; font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.mode .rec strong { font-size: 20px; color: var(--amber); }
.mini-board { width: 52px; height: 52px; border-radius: 8px; background: var(--maple); display: grid; gap: 2px; padding: 4px; box-sizing: border-box; }
.mini-board i { border-radius: 2px; background: var(--maple-2); }
.mini-board i.f { background: var(--w3); }
.foot { text-align: center; color: var(--muted); font-size: 12px; letter-spacing: .08em; }

/* ---------- Game ---------- */
#game { flex: 1; width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 0; }
.bar { width: 100%; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; background: var(--panel); display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.scores { text-align: center; font-variant-numeric: tabular-nums; }
.scores .best { color: var(--muted); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.scores .best b { color: var(--amber); }
.scores .now { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; }
.mode-label { font-size: 11px; color: var(--muted); letter-spacing: .2em; text-transform: uppercase; }

.board-wrap { position: relative; }
#board {
  display: grid; gap: var(--gap); padding: 7px; border-radius: 14px;
  background: linear-gradient(180deg, var(--maple), var(--groove));
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 10px 0 var(--w2), 0 18px 30px rgba(0,0,0,.5);
  touch-action: none;
}
.cell { width: var(--cell); height: var(--cell); border-radius: 5px; background: var(--maple-2); box-shadow: inset 0 2px 3px rgba(80,45,15,.35); }
.cell.alt { background: #bd915d; }
.blk, .cell.b {
  box-shadow: inset 0 3px 0 rgba(255,255,255,.28), inset 0 -4px 0 rgba(0,0,0,.25);
  background-image: repeating-linear-gradient(100deg, rgba(255,255,255,.07) 0 2px, transparent 2px 7px);
}
.c1 { background-color: var(--w1) !important; } .c2 { background-color: var(--w2) !important; } .c3 { background-color: var(--w3) !important; }
.c4 { background-color: var(--w4) !important; } .c5 { background-color: var(--w5) !important; } .c6 { background-color: var(--w6) !important; }
.cell.preview { background-color: var(--w3); opacity: .55; }
.cell.will { box-shadow: inset 0 0 0 3px var(--amber), inset 0 3px 0 rgba(255,255,255,.28); }
.cell.clearing { animation: pop .32s ease-in forwards; }
@keyframes pop { 40% { transform: scale(1.12); filter: brightness(1.6); } 100% { transform: scale(.2); opacity: 0; } }

.combo, .gain {
  position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none;
  font-family: var(--font-display); font-weight: 800; letter-spacing: .04em; white-space: nowrap;
  text-shadow: 0 3px 0 rgba(0,0,0,.45);
}
.gain { color: var(--ink); font-size: 30px; animation: rise .9s ease-out forwards; }
.combo { color: var(--amber); font-size: 26px; text-transform: uppercase; animation: rise 1.1s ease-out forwards; }
@keyframes rise { from { opacity: 0; translate: 0 10px; } 15% { opacity: 1; } to { opacity: 0; translate: 0 -46px; } }

#tray { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; min-height: 120px; max-height: 190px; touch-action: none; }
.slot { display: grid; place-items: center; border-radius: 12px; transition: opacity .2s; }
.slot.sel { background: rgba(234,165,60,.14); box-shadow: inset 0 0 0 2px var(--amber); }
.slot.dim { opacity: .3; }
.slot.away { visibility: hidden; }
.piece { display: grid; gap: 3px; }
.piece i { width: var(--m); height: var(--m); border-radius: 4px; }
.piece i.e { visibility: hidden; }

.drag { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; display: grid; gap: var(--gap); filter: drop-shadow(0 10px 10px rgba(0,0,0,.45)); }
.drag i { width: var(--cell); height: var(--cell); border-radius: 5px; }
.drag i.e { visibility: hidden; }

/* ---------- Overlay ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
  background: rgba(20,12,8,.72);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  width: 100%; max-width: 340px; padding: 26px 22px; border-radius: 18px; text-align: center; display: grid; gap: 14px;
  background: var(--panel); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 8px 0 rgba(0,0,0,.4);
  animation: drop .35s cubic-bezier(.2,1.4,.4,1);
}
@keyframes drop { from { transform: translateY(-24px) scale(.96); opacity: 0; } }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 30px; letter-spacing: .04em; text-transform: uppercase; }
.card p { margin: 0; color: var(--muted); }
.card .big { font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.card .newrec { color: var(--amber); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; }
.btn { padding: 14px 18px; border-radius: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; box-shadow: 0 5px 0 rgba(0,0,0,.35); }
.btn.primary { background: var(--amber); color: #2a1a0c; }
.btn.ghost { background: rgba(255,255,255,.06); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; }
}
</style>

<div id="app">
  <section id="menu" aria-label="Menu inicial">
    <div class="logo">
      <div class="logo-blocks" aria-hidden="true">
        <i class="blk c1"></i><i class="blk c3"></i><i class="blk c4"></i><i class="blk c6"></i>
      </div>
      <h1>BLOCK <span>ALT</span> UNO</h1>
      <p class="tag">Quebra-cabeça de blocos de madeira</p>
    </div>
    <div class="modes">
      <button class="mode" id="play-classic" data-mode="classic">
        <span class="mini-board" style="grid-template-columns:repeat(4,1fr)" aria-hidden="true">
          <i></i><i></i><i class="f"></i><i></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i class="f"></i><i></i><i></i><i></i><i class="f"></i><i class="f"></i><i></i>
        </span>
        <span><b>Clássico</b><small>Tabuleiro 8×8 · limpe linhas e colunas</small></span>
        <span class="rec"><em>Recorde</em><strong id="rec-classic">0</strong></span>
      </button>
      <button class="mode" id="play-sudoku" data-mode="sudoku">
        <span class="mini-board" style="grid-template-columns:repeat(3,1fr)" aria-hidden="true">
          <i class="f"></i><i class="f"></i><i></i><i class="f"></i><i class="f"></i><i></i><i></i><i></i><i class="f"></i>
        </span>
        <span><b>Sudoku</b><small>Tabuleiro 9×9 · linhas, colunas e quadrados 3×3</small></span>
        <span class="rec"><em>Recorde</em><strong id="rec-sudoku">0</strong></span>
      </button>
    </div>
    <p class="foot">Funciona sem internet · sem anúncios</p>
  </section>

  <section id="game" hidden aria-label="Partida">
    <div class="bar">
      <button class="icon-btn" id="btn-home" aria-label="Voltar ao menu">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="scores">
        <div class="mode-label" id="mode-label">Clássico</div>
        <div class="now" id="score" aria-live="polite">0</div>
        <div class="best">Recorde <b id="best">0</b></div>
      </div>
      <button class="icon-btn" id="btn-sound" aria-label="Som ligado" aria-pressed="true">
        <svg viewBox="0 0 24 24" id="snd-on"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9a4 4 0 010 6M19.5 6.5a8 8 0 010 11"/></svg>
        <svg viewBox="0 0 24 24" id="snd-off" hidden><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
    </div>
    <div class="board-wrap" id="board-wrap">
      <div id="board" role="grid" aria-label="Tabuleiro"></div>
    </div>
    <div id="tray" aria-label="Peças disponíveis"></div>
  </section>

  <div class="overlay" id="over" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="over-title">
      <h2 id="over-title">Fim de jogo</h2>
      <p>Nenhuma peça cabe no tabuleiro.</p>
      <div class="big" id="over-score">0</div>
      <div class="newrec" id="over-rec" hidden>Novo recorde!</div>
      <p id="over-best"></p>
      <button class="btn primary" id="btn-again">Jogar de novo</button>
      <button class="btn ghost" id="btn-menu">Menu</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);

  // ---------- storage (always guarded) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("bau." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("bau." + k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem("bau." + k); } catch (e) {} },
  };

  // ---------- pieces ----------
  const BASE = ["x", "xx", "xxx", "xxxx", "xxxxx", "xx/xx", "xxx/xxx", "xxx/xxx/xxx",
    "xx/x.", "xxx/x../x..", "xxx/x..", "xxx/.x.", "xx./.xx"];
  function norm(cells) {
    const mr = Math.min(...cells.map((p) => p[0])), mc = Math.min(...cells.map((p) => p[1]));
    return cells.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  }
  const VARIANTS = BASE.map((s) => {
    let cells = [];
    s.split("/").forEach((row, r) => [...row].forEach((ch, c) => { if (ch === "x") cells.push([r, c]); }));
    const out = [], seen = new Set();
    for (let i = 0; i < 4; i++) {
      cells = norm(cells);
      const k = JSON.stringify(cells);
      if (!seen.has(k)) { seen.add(k); out.push(cells); }
      cells = cells.map(([r, c]) => [c, -r]);
    }
    return out;
  });
  const rnd = (n) => Math.floor(Math.random() * n);
  function randomPiece() {
    const v = VARIANTS[rnd(VARIANTS.length)];
    return { cells: v[rnd(v.length)], color: S.mode === "sudoku" ? 3 : 1 + rnd(6) };
  }
  const dims = (cells) => [1 + Math.max(...cells.map((p) => p[0])), 1 + Math.max(...cells.map((p) => p[1]))];

  // ---------- state ----------
  const MODES = { classic: { n: 8, label: "Clássico", boxes: false }, sudoku: { n: 9, label: "Sudoku", boxes: true } };
  let S = null; // { mode, n, board[], tray[3], score, combo }
  let cellEls = [];

  function canPlace(board, n, cells, r0, c0) {
    for (const [r, c] of cells) {
      const rr = r0 + r, cc = c0 + c;
      if (rr < 0 || cc < 0 || rr >= n || cc >= n || board[rr * n + cc]) return false;
    }
    return true;
  }
  function fitsAnywhere(piece) {
    for (let r = 0; r < S.n; r++) for (let c = 0; c < S.n; c++) if (canPlace(S.board, S.n, piece.cells, r, c)) return true;
    return false;
  }
  function findClears(board) {
    const n = S.n, idx = new Set();
    let lines = 0;
    for (let r = 0; r < n; r++) {
      let full = true; for (let c = 0; c < n; c++) if (!board[r * n + c]) { full = false; break; }
      if (full) { lines++; for (let c = 0; c < n; c++) idx.add(r * n + c); }
    }
    for (let c = 0; c < n; c++) {
      let full = true; for (let r = 0; r < n; r++) if (!board[r * n + c]) { full = false; break; }
      if (full) { lines++; for (let r = 0; r < n; r++) idx.add(r * n + c); }
    }
    if (MODES[S.mode].boxes) {
      for (let br = 0; br < 3; br++) for (let bc = 0; bc < 3; bc++) {
        let full = true;
        for (let r = 0; r < 3 && full; r++) for (let c = 0; c < 3; c++) if (!board[(br * 3 + r) * n + bc * 3 + c]) { full = false; break; }
        if (full) { lines++; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) idx.add((br * 3 + r) * n + bc * 3 + c); }
      }
    }
    return { idx, lines };
  }
  function newTray() {
    // Try a few times so at least one piece of the new set fits the current board.
    let tray;
    for (let t = 0; t < 25; t++) {
      tray = [randomPiece(), randomPiece(), randomPiece()];
      if (tray.some(fitsAnywhere)) break;
    }
    return tray;
  }

  // ---------- sound (generated, no files) ----------
  let actx = null, soundOn = store.get("sound", true);
  function tone(freq, dur, type, vol, delay) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * .6, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  const sfx = {
    place: () => tone(180, .09, "triangle", .25),
    clear: (k) => { tone(520, .16, "sine", .18); tone(780, .2, "sine", .14, .07); if (k > 1) tone(1040, .24, "sine", .12, .14); },
    over: () => { tone(300, .3, "triangle", .2); tone(200, .45, "triangle", .2, .18); },
  };
  function renderSound() {
    $("snd-on").hidden = !soundOn; $("snd-off").hidden = soundOn;
    $("btn-sound").setAttribute("aria-pressed", String(soundOn));
    $("btn-sound").setAttribute("aria-label", soundOn ? "Som ligado" : "Som desligado");
  }

  // ---------- layout ----------
  function sizeBoard() {
    if (!S) return;
    const app = $("app"), cs = getComputedStyle(app);
    const w = Math.min(app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), 480);
    const h = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 96 - 140 - 40;
    const gap = 3, pad = 14;
    const avail = Math.max(160, Math.min(w, h));
    const cell = Math.floor((avail - pad - gap * (S.n - 1)) / S.n);
    document.documentElement.style.setProperty("--cell", Math.max(20, Math.min(cell, 54)) + "px");
    renderTray();
  }

  // ---------- rendering ----------
  function buildBoard() {
    const b = $("board");
    b.innerHTML = "";
    b.style.gridTemplateColumns = `repeat(${S.n}, var(--cell))`;
    cellEls = [];
    for (let i = 0; i < S.n * S.n; i++) {
      const d = document.createElement("div");
      d.dataset.i = i;
      d.setAttribute("role", "gridcell");
      b.appendChild(d); cellEls.push(d);
    }
    renderBoard();
  }
  function baseClass(i) {
    const r = Math.floor(i / S.n), c = i % S.n;
    const alt = MODES[S.mode].boxes && (Math.floor(r / 3) + Math.floor(c / 3)) % 2 === 1;
    return "cell" + (alt ? " alt" : "");
  }
  function renderBoard(preview) {
    for (let i = 0; i < cellEls.length; i++) {
      const v = S.board[i];
      let cls = baseClass(i);
      if (v) cls += " b c" + v;
      else if (preview && preview.cells.has(i)) cls += " preview c" + preview.color;
      if (preview && preview.will.has(i)) cls += " will";
      cellEls[i].className = cls;
    }
  }
  function pieceGrid(piece, el, mini) {
    const [h, w] = dims(piece.cells);
    el.style.gridTemplateColumns = `repeat(${w}, ${mini ? "var(--m)" : "var(--cell)"})`;
    el.innerHTML = "";
    const set = new Set(piece.cells.map(([r, c]) => r * w + c));
    for (let i = 0; i < h * w; i++) {
      const d = document.createElement("i");
      d.className = set.has(i) ? "blk c" + piece.color : "e";
      el.appendChild(d);
    }
  }
  let selected = -1;
  function renderTray() {
    const tray = $("tray");
    tray.innerHTML = "";
    const cell = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cell")) || 40;
    const slotW = tray.clientWidth / 3 - 16;
    S.tray.forEach((p, i) => {
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.dataset.i = i;
      if (p) {
        const [h, w] = dims(p.cells);
        const m = Math.max(10, Math.min(cell * .58, (slotW - 3 * (w - 1)) / w, (150 - 3 * (h - 1)) / h));
        const g = document.createElement("div");
        g.className = "piece"; g.style.setProperty("--m", m + "px");
        pieceGrid(p, g, true);
        slot.appendChild(g);
        slot.tabIndex = 0;
        slot.setAttribute("role", "button");
        slot.setAttribute("aria-label", `Peça ${i + 1}, ${p.cells.length} blocos`);
        if (!fitsAnywhere(p)) slot.classList.add("dim");
        if (i === selected) slot.classList.add("sel");
      }
      tray.appendChild(slot);
    });
  }
  function renderScore() {
    $("score").textContent = S.score;
    $("best").textContent = Math.max(S.score, store.get("best." + S.mode, 0));
  }
  function float(cls, text, top) {
    const d = document.createElement("div");
    d.className = cls; d.textContent = text; d.style.top = top + "px";
    $("board-wrap").appendChild(d);
    setTimeout(() => d.remove(), 1200);
  }

  // ---------- moves ----------
  function place(ti, r0, c0) {
    const p = S.tray[ti];
    if (!p || !canPlace(S.board, S.n, p.cells, r0, c0)) return false;
    for (const [r, c] of p.cells) S.board[(r0 + r) * S.n + c0 + c] = p.color;
    S.tray[ti] = null;
    selected = -1;
    let gained = p.cells.length;
    const { idx, lines } = findClears(S.board);
    if (lines) {
      S.combo += 1;
      gained += 10 * lines * lines * S.combo;
      const was = new Map([...idx].map((i) => [i, S.board[i]]));
      idx.forEach((i) => { S.board[i] = 0; });
      renderBoard();
      was.forEach((v, i) => cellEls[i].classList.add("c" + v, "b", "clearing"));
      setTimeout(() => renderBoard(), 330);
      sfx.clear(lines);
      if (S.combo > 1) float("combo", "Combo ×" + S.combo, 30);
    } else {
      S.combo = 0;
      renderBoard();
      sfx.place();
    }
    S.score += gained;
    if (lines) float("gain", "+" + gained, ($("board").clientHeight / 2) - 20);
    if (S.tray.every((t) => !t)) S.tray = newTray();
    renderTray(); renderScore(); save();
    const left = S.tray.filter(Boolean);
    if (!left.some(fitsAnywhere)) setTimeout(gameOver, lines ? 650 : 350);
    return true;
  }
  function save() { store.set("game." + S.mode, S); }
  function gameOver() {
    const key = "best." + S.mode, prev = store.get(key, 0), isRec = S.score > prev;
    if (isRec) store.set(key, S.score);
    store.del("game." + S.mode);
    sfx.over();
    $("over-score").textContent = S.score;
    $("over-rec").hidden = !isRec;
    $("over-best").textContent = isRec ? "" : "Recorde: " + prev;
    $("over-best").hidden = isRec;
    $("over").hidden = false;
    $("btn-again").focus();
    S.over = true;
  }

  // ---------- drag & tap ----------
  let drag = null;
  function step() {
    const a = cellEls[0].getBoundingClientRect(), b = cellEls[1].getBoundingClientRect();
    return { x0: a.left, y0: a.top, s: b.left - a.left };
  }
  function previewFor(ti, r0, c0) {
    const p = S.tray[ti];
    if (!canPlace(S.board, S.n, p.cells, r0, c0)) return null;
    const b = S.board.slice();
    const cells = new Set();
    for (const [r, c] of p.cells) { const i = (r0 + r) * S.n + c0 + c; b[i] = p.color; cells.add(i); }
    return { cells, color: p.color, will: findClears(b).idx };
  }
  function moveDrag(x, y) {
    const lift = drag.touch ? drag.h + drag.cell * 1.1 : drag.h / 2;
    const left = x - drag.w / 2, top = y - lift;
    drag.el.style.transform = `translate(${left}px, ${top}px)`;
    const g = step();
    const r0 = Math.round((top - g.y0) / g.s), c0 = Math.round((left - g.x0) / g.s);
    const pv = previewFor(drag.ti, r0, c0);
    drag.at = pv ? [r0, c0] : null;
    renderBoard(pv);
  }
  $("tray").addEventListener("pointerdown", (e) => {
    if (!S || S.over) return;
    const slot = e.target.closest(".slot");
    if (!slot || !S.tray[slot.dataset.i]) return;
    e.preventDefault();
    const ti = +slot.dataset.i, p = S.tray[ti];
    const el = document.createElement("div");
    el.className = "drag";
    pieceGrid(p, el, false);
    document.body.appendChild(el);
    const cell = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cell"));
    const [h, w] = dims(p.cells);
    drag = { ti, el, slot, cell, w: w * cell + (w - 1) * 3, h: h * cell + (h - 1) * 3,
      touch: e.pointerType !== "mouse", sx: e.clientX, sy: e.clientY, moved: false, at: null, id: e.pointerId };
    el.style.visibility = "hidden";
    try { slot.setPointerCapture(e.pointerId); } catch (_) {}
  });
  window.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return;
    if (!drag.moved) { drag.moved = true; drag.el.style.visibility = ""; drag.slot.classList.add("away"); selected = -1; }
    moveDrag(e.clientX, e.clientY);
  });
  function endDrag(e, cancel) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    d.el.remove();
    if (!d.moved && !cancel) {
      selected = selected === d.ti ? -1 : d.ti;
      renderTray();
      return;
    }
    if (cancel || !d.at || !place(d.ti, d.at[0], d.at[1])) { renderBoard(); renderTray(); }
  }
  window.addEventListener("pointerup", (e) => endDrag(e, false));
  window.addEventListener("pointercancel", (e) => endDrag(e, true));

  // Tap a piece, then tap the board: the tapped cell becomes part of the piece.
  $("board").addEventListener("click", (e) => {
    if (!S || S.over || selected < 0) return;
    const t = e.target.closest("[data-i]");
    if (!t) return;
    const i = +t.dataset.i, r = Math.floor(i / S.n), c = i % S.n, p = S.tray[selected];
    for (const [pr, pc] of p.cells) if (place(selected, r - pr, c - pc)) return;
  });
  $("tray").addEventListener("keydown", (e) => {
    const slot = e.target.closest(".slot");
    if (!slot || (e.key !== "Enter" && e.key !== " ")) return;
    e.preventDefault();
    selected = selected === +slot.dataset.i ? -1 : +slot.dataset.i;
    renderTray();
  });

  // ---------- screens ----------
  function showMenu() {
    S = null; selected = -1;
    $("game").hidden = true; $("over").hidden = true; $("menu").hidden = false;
    for (const m of Object.keys(MODES)) {
      $("rec-" + m).textContent = store.get("best." + m, 0);
      const saved = store.get("game." + m, null);
      $("play-" + m).querySelector("small").textContent = saved
        ? `Continuar partida · ${saved.score} pontos`
        : (m === "classic" ? "Tabuleiro 8×8 · limpe linhas e colunas" : "Tabuleiro 9×9 · linhas, colunas e quadrados 3×3");
    }
  }
  function startGame(mode, fresh, restored) {
    const n = MODES[mode].n;
    const saved = restored || (fresh ? null : store.get("game." + mode, null));
    if (saved && saved.board && saved.board.length === n * n && !saved.over) {
      S = saved;
    } else {
      S = { mode, n, board: new Array(n * n).fill(0), tray: [], score: 0, combo: 0 };
      S.tray = newTray();
    }
    selected = -1;
    $("menu").hidden = true; $("over").hidden = true; $("game").hidden = false;
    $("mode-label").textContent = MODES[mode].label;
    buildBoard(); sizeBoard(); renderScore(); save();
  }
  document.querySelectorAll(".mode").forEach((b) => b.addEventListener("click", () => startGame(b.dataset.mode, false)));
  $("btn-home").addEventListener("click", showMenu);
  $("btn-menu").addEventListener("click", showMenu);
  $("btn-again").addEventListener("click", () => startGame(S.mode, true));
  $("btn-sound").addEventListener("click", () => { soundOn = !soundOn; store.set("sound", soundOn); renderSound(); sfx.place(); });
  window.addEventListener("resize", sizeBoard);
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  // Android back button (sent by the app shell): go back to the menu, or let the app close.
  window.blockAltUnoBack = () => {
    if (!$("over").hidden || !$("game").hidden) { showMenu(); return true; }
    return false;
  };

  function start(data) {
    renderSound();
    if (data && data.S && !data.S.over) startGame(data.S.mode, false, data.S);
    else showMenu();
  }
  window.claude?.hot?.snapshot?.(() => ({ S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
